<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="head">My To Do List</h1>

    <button class="dark">
        <span class="bulb">💡</span>
    </button>

    <div class="div1">
        <input type="text" class="lists" placeholder="Enter task">
        <button id="submit">Add</button>
    </div>

    <div class="div2">
        <ul class="work"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
